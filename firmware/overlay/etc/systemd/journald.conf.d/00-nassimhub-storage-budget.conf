# The root filesystem is a few GiB of eMMC with no other storage to sacrifice.
# Without a cap the journal grows until the disk is full, and a full root
# filesystem on this device means recovery over USB. 120M is far more journal
# than any investigation of this agent has needed; 400M of kept-free headroom
# is for everything else on the stick.
[Journal]
SystemMaxUse=120M
SystemKeepFree=400M
